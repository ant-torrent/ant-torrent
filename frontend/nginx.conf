# AntTorrent Web：SPA 静态资源 + /qbt-api 反向代理（容器内替换镜像默认配置）
# 源码部署可复用本文件：仅需把 set $ant_backend 改为后端实际地址（如 http://127.0.0.1:8080），
# 并按需将 server 块并入现有 nginx 配置。
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    # WebSocket 升级：Connection 头不能写死，需按 Upgrade 头映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 仅压缩静态资源；代理响应明确不压缩（gzip 会缓冲 SSE 流）
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_proxied      off;

    server {
        listen      80;
        server_name _;

        # 代理路径会转发 qB API（含 .torrent 上传），放宽请求体限制
        client_max_body_size 100m;

        # ---- 前端 SPA ----
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            try_files  $uri $uri/ /index.html;
        }

        # ---- API 反向代理：/qbt-api/* → backend:8080/api/* ----
        location /qbt-api/ {
            # Docker 内嵌 DNS 按需解析：backend 容器重建后不会持有失效 IP
            resolver 127.0.0.11 valid=10s ipv6=off;

            # set 必须在 rewrite ... break 之前：break 会终止本 location 内
            # 后续 rewrite 模块指令（含 set），顺序颠倒会导致变量为空、
            # proxy_pass 报 invalid URL prefix in ""
            set $ant_backend http://backend:8080;
            # 与 Vite 代理同契约：/qbt-api/* → 后端 /api/*（后端路由挂载在 /api 前缀下）
            rewrite ^/qbt-api(/.*)$ /api$1 break;
            proxy_pass $ant_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE（AI 对话）流式输出 + WebSocket 长连接
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
